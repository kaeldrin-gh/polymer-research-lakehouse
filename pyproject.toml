[project]
name = "polymer-research-lakehouse"
version = "0.1.0"
description = "A small data mesh on AWS for polymer research (OpenAlex) and industrial sustainability (EEA) data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-cdk-lib==2.272.0",
    "constructs>=10.8,<11",
    "cdk-nag>=3.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff==0.16.10",
    # dbt runs on DuckDB with the committed sample in CI and locally; the
    # Athena adapter is added when the project first runs on AWS (M3).
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
    "duckdb>=1.5,<1.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The research package is what the Lambda functions run (see
# infra/stacks/research_pipeline.py); infra/ is the CDK app and is not packaged.
[tool.hatch.build.targets.wheel]
packages = ["src/research"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
