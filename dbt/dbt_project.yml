name: polymer_research
version: "1.0.0"
config-version: 2
profile: polymer_research

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  # Products judge "future" publication dates against this date. Null means
  # today; unit tests pin it.
  as_of_date: null

# Each schema is a Glue database on Athena (see infra/stacks/data_lake.py).
# Every domain keeps its staging views apart from its data products.
models:
  polymer_research:
    research:
      staging:
        +schema: research_staging
        +materialized: view
      intermediate:
        +schema: research_staging
        +materialized: view
      products:
        +schema: research
        +materialized: table
        +table_type: iceberg
        +contract:
          enforced: true
    sustainability:
      staging:
        +schema: sustainability_staging
        +materialized: view
      products:
        +schema: sustainability
        +materialized: table
        +table_type: iceberg
        +contract:
          enforced: true
    # Products that join domains; they own no raw data.
    shared:
      +schema: products
      +materialized: table
      +table_type: iceberg
      +contract:
        enforced: true

seeds:
  polymer_research:
    +schema: sustainability_staging
