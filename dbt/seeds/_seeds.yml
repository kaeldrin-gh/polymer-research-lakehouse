version: 2

seeds:
  - name: eea_country_codes
    description: >
      The EEA's English country names mapped to ISO 3166-1 alpha-2 codes, as OpenAlex
      uses them (United Kingdom is GB, Greece is GR). Covers every country in the
      industrial reporting release.
    config:
      column_types:
        country_name: varchar
        country_code: varchar
    columns:
      - name: country_name
        data_tests: [unique, not_null]
      - name: country_code
        data_tests: [unique, not_null]

  - name: eea_reporting_exits
    description: >
      Countries that stopped reporting to the EEA for a known reason, with their last
      reporting year. Years after it count as "left" in reporting_coverage, not as gaps.
    config:
      column_types:
        country_code: varchar
        last_reporting_year: bigint
        reason: varchar
    columns:
      - name: country_code
        data_tests: [unique, not_null]
