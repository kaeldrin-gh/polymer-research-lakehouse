version: 2

sources:
  - name: research
    schema: research
    description: >
      Tables the research domain's load pipeline writes (infra/stacks/research_pipeline.py).
    tables:
      - name: works
        description: >
          One row per polymer and plastics work (OpenAlex subfield 2507), current version.
          Loaded from the quarterly OpenAlex snapshot and a daily API feed; the newer
          `updated_date` wins. Institutions and countries only: no author names or ORCIDs.
        meta:
          domain: research
          owner: research domain team
          data_product: true
          source_licence: CC0 (OpenAlex)
        columns:
          - name: id
            description: OpenAlex work ID (URL form).
            data_tests:
              - unique
              - not_null
          - name: updated_date
            description: When OpenAlex last changed the work; the MERGE keeps the newest.
            data_tests:
              - not_null
          - name: source
            description: Which load wrote the current row.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["snapshot", "api"]
