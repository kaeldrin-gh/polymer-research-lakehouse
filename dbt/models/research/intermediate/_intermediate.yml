version: 2

models:
  - name: int_research__countable_works
    description: "Works the research products count: not retracted, plausible publication year."
    columns:
      - name: work_id
        data_tests: [unique, not_null]
      - name: publication_year
        data_tests: [not_null]

  - name: int_research__work_countries
    description: One row per countable work and institution country.
    data_tests:
      - unique:
          arguments:
            column_name: "work_id || '|' || country_code"
    columns:
      - name: country_code
        data_tests: [not_null]
